const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
let aberto=false;
async function abre(p){
  if(aberto) return; 
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
  try{sessionStorage.setItem('p1030k',p)}catch(e){}
  aberto=true;
  document.open();document.write(t);document.close();
}
